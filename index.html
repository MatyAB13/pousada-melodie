<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Natura 3D Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <p class="badge">Cosmética consciente</p>
        <h1>Tienda 3D Natura</h1>
        <p class="subtitle">Explora productos en 3D, gira la cámara y agrega tus favoritos al carrito.</p>
      </div>
      <button id="toggle-spin" class="btn">Pausar rotación</button>
    </header>

    <main class="layout">
      <section class="viewer-panel">
        <canvas id="scene" aria-label="Vista 3D de productos Natura"></canvas>
        <p class="hint">Arrastra para rotar · Rueda para zoom · Click en un producto para seleccionarlo</p>
      </section>

      <aside class="side-panel">
        <h2>Catálogo Natura</h2>
        <ul id="product-list" class="product-list"></ul>

        <div class="cart">
          <h3>Carrito</h3>
          <ul id="cart-list"></ul>
          <p id="cart-total">Total: $0</p>
          <button id="checkout" class="btn btn-primary">Finalizar compra</button>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
